<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>QUOTE NOT FOUND</title>
<style>
*, *::before, *::after {
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
  box-sizing: border-box;
}
html, body {
  margin: 0;
  min-height: 100%;
  background: #0A0A0A;
  color: #FFFFFF;
  font-family: Inter, Arial, sans-serif;
}
body {
  display: grid;
  place-items: center;
  padding: 24px;
}
.card {
  width: min(100%, 520px);
  border: 1px solid rgba(201, 168, 76, 0.45);
  background: linear-gradient(180deg, #141414 0%, #0A0A0A 100%);
  border-radius: 18px;
  padding: 28px;
  text-align: center;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
}
.logo {
  display: inline-grid;
  place-items: center;
  width: 68px;
  height: 68px;
  margin: 0 auto 18px;
  border: 2px solid #C9A84C;
  border-radius: 50%;
  color: #C9A84C;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 1px;
}
h1 {
  margin: 0 0 10px;
  color: #C9A84C;
  font-size: 22px;
  line-height: 1.15;
  letter-spacing: 2px;
  text-transform: uppercase;
}
p {
  margin: 0 0 14px;
  color: #D8D8D8;
  font-size: 15px;
  line-height: 1.6;
}
a {
  color: #C9A84C;
  font-weight: 800;
}
.btn {
  display: inline-block;
  margin-top: 10px;
  padding: 14px 18px;
  background: #C9A84C;
  color: #0A0A0A;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 1px;
  text-decoration: none;
  text-transform: uppercase;
}
@media print {
  html, body, * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  body {
    background: #FFFFFF !important;
    color: #0A0A0A !important;
  }
  .card {
    border: 1px solid #C9A84C !important;
    box-shadow: none !important;
  }
}
</style>
</head>
<body>
<main class="card">
  <div class="logo">MCK</div>
  <h1>QUOTE NOT FOUND</h1>
  <p>Quote not found - please contact <a href="mailto:projects@microcementking.au">projects@microcementking.au</a>.</p>
  <a class="btn" href="https://mattysdd.github.io/mck-business-tools/index.html">OPEN QUOTE TOOLS</a>
</main>
</body>
</html>
